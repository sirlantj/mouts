<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>DeveloperStore - Ambev Developer Evaluation</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Inter font -->
  <link rel="preconnect" href="https://rsms.me/">
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css">

  <!-- Tailwind CSS via CDN (Play CDN) -->
  <!-- Usado por causa de incompatibilidade entre Tailwind v4 PostCSS e o builder esbuild do Angular 21.
       Em producao, configurar o PostCSS pipeline corretamente e remover este script. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter var', 'Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'sans-serif'],
          },
        },
      },
    };
  </script>
</head>

</body>
</html>
